# Aggiornamento notturno dell'archivio da Wikipedia.
#
# Il job scarica la pagina dei sondaggi, esegue il parser vero (estratto da index.html),
# unisce le rilevazioni nuove a dati/archivio.json, deposita le voci-evento nel registro e
# RIGENERA dati/anteprima.png, che è l'og:image: l'immagine è un prodotto dell'archivio, e
# finché non lo era il link condiviso mostrava numeri diversi da quelli della pagina.
# Tocca dati/ e, di index.html, LA SOLA REGIONE FRA I DUE MARCATORI «META DELLO STATO»,
# dove sta og:title — che deve dire lo stato del modello a chi legge il file servito senza
# eseguire niente, cioè a ogni aggregatore. Fino al 23 agosto 2026 la regola era «solo
# dati/», e la regola era anche il segnale d'allarme. Adesso il segnale è una prova: con
# LAVORO_NOTTURNO=1 npm run verifica legge il diff di index.html e fallisce se una riga
# cambiata cade fuori dai marcatori. Un commit notturno che tocchi altro resta un'anomalia,
# e adesso è un'anomalia che si ferma da sola invece di essere solo dichiarata.
#
# Il modo di fallire è non fare niente: le guardie dentro aggiorna.mjs terminano il
# processo prima di ogni scrittura, npm run verifica fa da cancello dopo, e il push non
# forza mai — se il rebase non è pulito il job si arrende e riprova la notte dopo.
# Quando la guardia chiede una decisione umana (colonne di lista non riconosciute,
# configurazioni senza contenitore) viene aperta una issue con l'elenco di cosa mappare:
# è il segnale atteso per l'8 settembre, al deposito delle liste.
#
# Dopo il push c'è la spazzolata: il banco rilanciato con l'orologio al 23 ottobre, per
# sapere quali prove scadranno prima che scadano. Non ferma niente — apre una issue e basta
# — perché una prova che cadrà fra due mesi non è una ragione per non pubblicare i sondaggi
# di stanotte.
name: Aggiorna archivio
on:
  # OTTO TENTATIVI INVECE DI UNO, e la ragione e' il contratto del servizio, non una
  # preferenza. Le esecuzioni programmate di GitHub sono dichiaratamente BEST-EFFORT:
  # vengono accodate e sotto carico slittano o saltano, e non esiste nessun parametro che le
  # renda puntuali. Misurato su due giorni consecutivi: il 27 agosto 2026 il tick delle 03:30
  # e' partito alle 14:28 — undici ore — e il 28 non e' mai nato. Storicamente cade fra le
  # 04:06 e le 04:21, cioe' con mezz'ora abbondante di ritardo strutturale anche quando va
  # bene.
  # Ogni tick pero' e' best-effort IN MODO INDIPENDENTE, quindi pianificandone parecchi la
  # probabilita' che NESSUNO parta crolla. Il cron smette di essere un istante e diventa una
  # finestra, che per un archivio notturno e' la garanzia che serve davvero: «entro le sette»
  # invece di «alle 3:30, forse». Quello che NON da' e' l'orario esatto — per quello
  # servirebbe un innesco esterno, che sposta il fallimento su una macchina accesa.
  # I MINUTI SONO DISPARI APPOSTA e costano zero: :00 e :30 sono gli orari che pianificano
  # tutti, quindi quelli con la coda piu' lunga.
  schedule:
  # E L'ORA CONTA PIU' DEI MINUTI, misurato il 29 agosto 2026 sui tre modelli dello stesso
  # account. Su 44 tick attesi in 57 ore ne sono partiti 10: il servizio consegna circa un
  # QUARTO di quello che promette, e vale per tutti e tre — Germania al 10-40%, UK al 16-33%.
  # Da cui la lezione che ha deciso questo cron: la frequenza compensa l'inaffidabilita', e
  # l'affidabilita' non si compra. Un job una volta al giorno al 23% salta tre giorni su
  # quattro; il «Review UK polling» gira ogni tre ore e allo stesso 16% fa comunque 1,3
  # esecuzioni al giorno, quindi SEMBRA sano. E' la stessa infrastruttura per tutti: cambia
  # quante volte ci provi.
  # La prima stesura di questa finestra metteva otto tick fra le 03:23 e le 06:53, cioe'
  # TUTTI dentro la stessa fascia — e nella notte del 29 agosto ne sono partiti ZERO. Otto
  # tentativi nella stessa buca valgono meno di due in due buche diverse: adesso sono sparsi
  # su diciotto ore, cosi' i tentativi sono indipendenti fra loro invece che esposti alla
  # stessa congestione.
  # NON PARTE PRIMA DELLE 03:23 per la ragione editoriale di sempre — i sondaggi della sera
  # devono essere in tabella — e piu' tardi non costa niente, anzi: significa PIU'
  # rilevazioni, non meno. E i dieci tick sono gratuiti perche' c'e' la guardia: il primo che
  # passa scrive, gli altri nove escono in pochi secondi.
  # L'indizio piu' debole, dichiarato come tale: fra i tick partiti il ritardo mediano e' 11
  # ore per quelli notturni e 66 minuti per quelli dalle 08:00 in poi, e i tre puntuali sul
  # serio erano tutti alle 17:xx. Sono cinque osservazioni per parte: coerente, non
  # dimostrato. Va rimisurato, non creduto.
    - cron: '23 3-21/2 * * *'   # dieci tentativi, dalle 03:23 alle 21:23, uno ogni due ore
  workflow_dispatch:
  # E IL TERZO INNESCO NON E' UN TIMER: OGNI PUSH SU main.
  # Misurato il 30 agosto 2026 sui tre modelli dello stesso account, ed e' il confronto
  # controllato che ha deciso questa riga. Nella stessa finestra — dalle 00:00 alle 09:04
  # UTC — Germania e UK hanno avuto un'esecuzione programmata ciascuna, in ritardo di tre e
  # di due minuti, e Israele ZERO su tre tick attesi: quella mattina GitHub consegnava, e
  # noi avevamo perso tre estrazioni di fila.
  # Ma il cron DEI DATI dell'UK e' UN TICK AL GIORNO, cioe' meno affidabile del nostro, e la
  # sera prima era partito alle 17:25 invece che alle 05:15 — dodici ore di ritardo. NON E'
  # IL LORO CRON A ESSERE MIGLIORE: e' che il cron non e' il loro unico innesco. Il loro job
  # dei dati parte anche su push, e chi scrive spinge piu' volte al giorno.
  # NESSUN FILTRO SU paths, ed e' voluto. Qui non si ricostruisce un prodotto che dipende da
  # certi file: si coglie un'OCCASIONE, e un commit di sola documentazione e' un'occasione
  # buona quanto un'altra per rinfrescare l'archivio. Un elenco di percorsi sarebbe un
  # secondo posto da tenere allineato in cambio di niente.
  # E IL GIRO SI CHIUDE PERCHE' LO CHIUDE LA GUARDIA: il job spinge un commit, quel commit
  # rientra da questa porta, la guardia legge la data che il job stesso ha appena scritto, e
  # il secondo giro esce in dieci secondi. E' lo stesso mestiere che Germania e UK affidano a
  # «!contains(head_commit.message, '[social-card]')» — con la differenza che quella e' una
  # convenzione di MESSAGGIO, che regge finche' nessuno riscrive un messaggio, e questa e'
  # un FATTO scritto in un file di dati.
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
concurrency: aggiorna-archivio
jobs:
  # LA GUARDIA STA IN UN JOB SUO, E NON E' UN VEZZO. Con otto tick sette notti su otto si
  # rifarebbe il lavoro gia' fatto, quindi serve uscire subito quando stanotte e' gia' andata.
  # Un passo dentro «aggiorna» non basterebbe: per uscire davvero prima di QUALUNQUE
  # scrittura ogni passo successivo dovrebbe portarsi un «if», e il primo che qualcuno
  # aggiunge dimenticandolo scrive. Con un job separato il job che scrive NON PARTE AFFATTO.
  # E il riepilogo resta intatto: il suo «if: always()» non va toccato, perche' su un tick a
  # vuoto il job che lo contiene e' saltato e non c'e' nessuna notte da raccontare. Un job
  # saltato si legge «skipped», non «failed»: un tick che esce subito non deve sembrare una
  # notte fallita, ed e' precisamente per questo che la guardia non esce con un errore.
  guardia:
    runs-on: ubuntu-latest
    outputs:
      gia: ${{ steps.leggi.outputs.gia }}
    steps:
      # «ref: main» E NON IL PREDEFINITO, ed e' nato col push il 30 agosto 2026. Su un
      # evento push il checkout predefinito prende il COMMIT CHE HA INNESCATO, non la punta
      # del ramo — e quel commit puo' essere piu' vecchio dello stato-job.json che una
      # esecuzione precedente ha appena scritto. La guardia risponde a «stanotte e' gia'
      # andata?», che e' una domanda su ADESSO: leggerla nel passato le fa dire di no
      # quando la risposta e' si', e il job rifa' quindici minuti di lavoro gia' fatto.
      # Per schedule e per dispatch non cambia niente — li' il predefinito E' la punta di
      # main — quindi la riga costa zero e chiude un caso che esiste solo per il push.
      - uses: actions/checkout@v4
        with: {ref: main}
      # dati/stato-job.json E' IL FILE GIUSTO perche' il job lo riscrive a OGNI notte
      # riuscita, anche a mani vuote: «c'e' la data di oggi» vuol dire «stanotte e' gia'
      # andata», non «stanotte ha trovato qualcosa». La data si confronta in UTC perche' in
      # UTC la scrive aggiorna.mjs, con toISOString().slice(0,10).
      # NIENTE setup-node E NIENTE npm install: node c'e' gia' sull'immagine del runner, e
      # una guardia che installa le dipendenze per leggere una riga di JSON costerebbe piu'
      # del lavoro che evita.
      - name: Stanotte e' gia' andata?
        id: leggi
        run: |
          OGGI=$(date -u +%F)
          # LA GUARDIA FALLISCE IN APERTURA: file assente, JSON guasto, campo mancante danno
          # stringa vuota, che non e' uguale a oggi, quindi SI PROCEDE. Meglio una notte
          # ridondante — che costa pochi secondi e non scrive niente — di una notte saltata
          # perche' il file che doveva autorizzarla era illeggibile.
          DATA=$(node -p "require('./dati/stato-job.json').data" 2>/dev/null || echo '')
          if [ "$DATA" = "$OGGI" ]; then
            echo "gia=1" >> "$GITHUB_OUTPUT"
            echo "stato-job.json porta gia' $OGGI: stanotte e' andata, non c'e' niente da fare"
          else
            echo "gia=0" >> "$GITHUB_OUTPUT"
            echo "stato-job.json porta '$DATA' e oggi e' $OGGI: si procede"
          fi
  aggiorna:
    needs: guardia
    # LA GUARDIA VALE PER TUTTO TRANNE IL DISPATCH, e la riga nomina l'evento ESENTE invece
    # degli eventi soggetti. Fino al 30 agosto 2026 diceva «diverso da schedule», e finche'
    # gli inneschi erano due le due scritture erano indistinguibili. Col push non lo sono
    # piu': «!= 'schedule'» lo avrebbe fatto scavalcare la guardia, e il push che il job fa
    # da se' sarebbe rientrato dalla porta del push scavalcandola di nuovo. Che il giro si
    # chiudesse comunque dipendeva dall'idempotenza di tre scritture — stato-job.json,
    # anteprima.png, og:title — cioe' da una garanzia che non e' dichiarata da nessuna parte.
    # UN ROMPI-ANELLO DEDOTTO NON E' UN ROMPI-ANELLO.
    # E la forma per esclusione fa si' che un innesco aggiunto domani nasca DENTRO la
    # guardia. L'altra lo fa nascere fuori, uno per uno e in silenzio: e' la stessa famiglia
    # dell'elenco cablato che resta indietro alla prima aggiunta.
    # IL DISPATCH RESTA ESENTE perche' e' una DECISIONE deliberata — «ho constatato che
    # l'archivio e' fermo, quindi lo faccio partire» — e una guardia che lo saltasse
    # renderebbe impossibile proprio il gesto per cui il dispatch esiste, compreso quello che
    # il confine dell'agente gli concede. Il 28 agosto 2026 e' servito due volte in mezz'ora.
    # E L'ESENZIONE E' SICURA PERCHE' CHI FA UN DISPATCH HA GIA' CONSTATATO: la vedetta lo
    # lancia solo dopo aver letto che l'archivio non porta la data di oggi, e una persona lo
    # lancia dopo aver guardato. La guardia non ripete una constatazione gia' fatta: la fa
    # dove non c'e'.
    if: github.event_name == 'workflow_dispatch' || needs.guardia.outputs.gia != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node test/estrai.mjs
      # DA QUANTE NOTTI È FERMO non è ricavabile dai file: una notte bloccata non committa
      # niente, quindi non lascia traccia nel repository. Lo sa solo la storia delle
      # esecuzioni, ed è per questo che il riepilogo la legge invece di dedurlo.
      - name: Da quante esecuzioni è fermo
        id: ferme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # UNA RIGA SOLA, E IL PERCHÉ VA LASCIATO SCRITTO. Qui c'era una continuazione
          # scritta come \n LETTERALE — due caratteri, non un a-capo. Dentro «run: |» la
          # shell la legge come la lettera n, la passa a gh come argomento, gh esce con
          # errore, e con «bash -e» il passo fallisce: il job muore PRIMA del parser.
          # È successo per tre esecuzioni di fila, il 23, 24 e 25 agosto 2026, in tredici
          # e senza che nessuno lo dicesse — il riepilogo guardava quello che il parser
          # aveva trovato, e il parser non era mai stato eseguito.
          # Il file resta YAML valido, quindi struttura.mjs lo caricava senza obiezioni:
          # è la seconda incarnazione della stessa trappola, e la prova che la coglie
          # adesso guarda i COMANDI e non solo la sintassi.
          N=$(gh run list --workflow 'Aggiorna archivio' --limit 20 --json conclusion,status --jq '[.[] | select(.status=="completed") | .conclusion] | index("success") // 0')
          echo "ferme=$N" >> "$GITHUB_OUTPUT"
          echo "esecuzioni fallite di fila prima di stanotte: $N"
      - name: Parser e guardie
        env:
          ESECUZIONI_FERME: ${{ steps.ferme.outputs.ferme }}
        run: node .github/scripts/aggiorna.mjs
      # L'ANTEPRIMA È UN PRODOTTO DELL'ARCHIVIO, e per tre giorni non lo è stata.
      # og:image era dichiarata in index.html dal 24 agosto 2026 e QUESTO PASSO NON ESISTEVA:
      # nessuno chiamava anteprima.mjs, né qui né in un npm script. L'immagine è stata scritta
      # due volte in tutta la sua vita, tutte e due a mano, mentre l'archivio andava avanti ogni
      # notte. Il 27 agosto il risultato era quello che un modello previsionale non può
      # permettersi: la card scaricata dalla pagina diceva 12 · 55 · 53 e l'anteprima del link
      # 12 · 57 · 51, con la data del 24 — DUE IMMAGINI DELLA STESSA PAGINA CON NUMERI DIVERSI,
      # nella stessa conversazione. E non era solo una figura vecchia: og:title lo scrive il job
      # ed era fresco, quindi sotto una frase di oggi c'era un disegno di tre giorni prima.
      # Il passo sta QUI, subito dopo il parser e prima della verifica, perché è lo stesso atto:
      # l'archivio è cambiato, quindi l'immagine è cambiata. Il file entra nel MEDESIMO commit
      # dell'archivio — è la sola forma in cui i due non possono divergere — e test/struttura.mjs
      # lo pretende invece di lasciarlo alla buona volontà di chi tocca questo file.
      # Se una guardia del rasterizzatore scatta il passo fallisce e la notte non pubblica
      # niente: un archivio nuovo con l'anteprima di ieri è esattamente il difetto che questo
      # passo esiste per chiudere, e pubblicarlo a metà è peggio che non pubblicarlo.
      # A mani vuote non scrive: anteprima.mjs confronta i byte e dice «identica, non riscritta».
      - name: Anteprima Open Graph
        run: node .github/scripts/anteprima.mjs
      # LAVORO_NOTTURNO=1 accende, dentro test/struttura.mjs, il controllo sul diff di
      # index.html: qui è il solo posto in cui esiste un «commit notturno» da giudicare.
      - name: Verifica completa con i dati nuovi
        env:
          LAVORO_NOTTURNO: '1'
        run: npm run verifica
      - name: Commit e push dei file dati e delle meta dello stato
        run: |
          # NIENTE GUARDIA QUI: c'era, e guardava un insieme DIVERSO da quello che finisce in
          # scena — «git diff --quiet dati/ index.html» contro i quattro file nominati sotto.
          # dati/da-fare.json sta in dati/ e NON è fra i quattro, quindi una notte in cui
          # cambia solo lui passava la guardia, non metteva in scena niente, e «git commit»
          # usciva 1 uccidendo il passo con bash -e. È la strada doppia di sempre: due modi
          # di rispondere a «c'è qualcosa da committare?», d'accordo finché i due insiemi
          # coincidono. Successo il 25 agosto 2026, ed è l'unico passo che il banco locale
          # non poteva provare perché il push è cablato su main.
          # La guardia sta DOPO git add ed è «--cached»: per costruzione guarda esattamente
          # quello che verrà committato, quindi non può divergere da sé stessa.
          git config user.name "aggiornamento-notturno"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html entra per la sola regione delle meta dello stato: il passo di
          # verifica qui sopra ha già fallito se il diff toccava altro
          # dati/anteprima.png sta QUI e non in un commit suo: l'immagine e i numeri che
          # racconta si muovono insieme o non si muovono affatto.
          git add dati/archivio.json dati/eventi-grezzi.json dati/stato-job.json dati/anteprima.png index.html
          # UNA NOTTE A MANI VUOTE NON È UN FALLIMENTO. Senza questa guardia, quando il
          # parser non cambia un byte «git commit» esce 1 perché non c'è niente da
          # committare, e con «bash -e» il passo muore: il job risulterebbe fallito e il
          # riepilogo aprirebbe una issue per una notte andata benissimo. Non era mai emerso
          # perché stato-job.json cambia quasi ogni notte; è emerso il 25 agosto 2026, al
          # primo rilancio a mano dopo che le stesse righe erano già state committate.
          if git diff --cached --quiet; then
            echo "niente da committare: la notte non ha cambiato nessun file"
            exit 0
          fi
          git commit -m "Aggiornare l'archivio e og:title dai sondaggi di Wikipedia (lavoro notturno)"
          # mai forzare: se nel frattempo è arrivato un push umano e il rebase non è
          # pulito, il job si arrende senza danni e riprova la notte successiva
          # --autostash, e non è un dettaglio: il parser scrive anche dati/da-fare.json, che
          # NON è fra i quattro file di questo commit — lo committa il passo del riepilogo,
          # più tardi, con la spazzolata unita. Quindi dopo ogni notte con qualcosa di nuovo
          # l'albero ha una modifica non in scena, e «git pull --rebase» si RIFIUTA di
          # partire: «cannot pull with rebase: You have unstaged changes». Il job arrivava
          # in fondo al parser e alla verifica e moriva qui, cioè l'archivio non si
          # pubblicava proprio nelle notti in cui c'era qualcosa da pubblicare.
          # Visto il 26 agosto 2026, al primo dispatch riuscito dopo la mappatura di Amcha.
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "rebase non pulito: mi arrendo senza forzare"
            exit 1
          fi
          git push origin main
      # LA SPAZZOLATA NON FERMA L'ARCHIVIO, ed è il motivo per cui sta DOPO il push.
      # npm run spazzola rilancia tutto il banco con l'orologio al 23 ottobre — il silenzio
      # demoscopico, il primo giorno in cui la finestra dei sette giorni si svuota da sola —
      # e dice quali prove danno per scontato un archivio fresco. Costa quattro minuti, che
      # in un job che gira una volta al giorno non si notano, ed è l'unico posto che se ne
      # accorgerebbe PRIMA del giorno in cui scatta.
      # Ma una prova che scadrà fra due mesi non è una ragione per smettere di pubblicare i
      # sondaggi di stanotte: il passo cattura l'esito invece di propagarlo, e quando cade
      # apre una issue come per le colonne di lista non riconosciute.
      - name: Spazzolata nel futuro
        id: spazzola
        run: |
          if npm run spazzola > spazzola.txt 2>&1; then
            echo "nessuna prova scade con l'orologio avanti"
          else
            echo "caduta=1" >> "$GITHUB_OUTPUT"
          fi
          cat spazzola.txt
      # ══ LA CONSEGNA, UNA VOLTA SOLA E IN FONDO ══
      #
      # Prima c'erano due issue — una per la guardia, una per la spazzolata — e le
      # segnalazioni restanti non erano da nessuna parte. Adesso il canale è uno:
      # dati/da-fare.json, e questa issue è la sua vista per una persona.
      #
      # LA REGOLA DEL SILENZIO. GitHub notifica alla CREAZIONE, al commento,
      # all'assegnazione e alla chiusura; NON alla modifica del corpo. Quindi: una email
      # quando la prima cosa da fare compare, silenzio finché resta pendente — il corpo si
      # riscrive e basta — e una email quando non resta niente e la issue si chiude. Se
      # arrivasse un'email ogni mattina, in una settimana nessuno la leggerebbe più.
      #
      # Sta in fondo e con if: always() perché deve uscire ANCHE quando npm run verifica è
      # rosso: quella è precisamente la notte in cui c'è qualcosa da fare.
      - name: Consegna il riepilogo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # il JavaScript sta in un file: multiriga dentro «run: |» rende il YAML invalido,
          # ed è già successo — la esecuzione fallisce in zero secondi e il job non parte
          # L'ESITO DEL JOB ARRIVA DA QUI, e non dai file: una notte bloccata non committa
          # niente, quindi non lascia traccia nel repository. job.status dentro un passo
          # «always()» dice come è andata FIN QUI, ed è l'unico posto in cui si sa.
          SPAZZOLA_CADUTA=${{ steps.spazzola.outputs.caduta }} ESITO_JOB=${{ job.status }} ESECUZIONI_FERME=${{ steps.ferme.outputs.ferme }} node .github/scripts/riepilogo.mjs
          [ -f corpo-dafare.md ] || exit 0
          # STESSO IDIOMA DELL'ALTRO COMMIT, e non per simmetria: la guardia sta DOPO
          # git add ed è «--cached», così guarda per costruzione esattamente i file che
          # verranno committati. Qui l'insieme è uno solo e le due forme coinciderebbero,
          # ma è precisamente la condizione in cui la forma sbagliata non si vede — nel
          # passo di sopra i due insiemi divergevano e il job moriva.
          #
          # E «STESSO IDIOMA» ERA UNA DICHIARAZIONE CHE IL CODICE NON MANTENEVA. Il commit
          # di sopra usa «git pull --rebase --autostash» con dodici righe che spiegano
          # perché l'autostash serve; questo diceva di fare la stessa cosa e chiamava
          # «git pull --rebase» nudo. Il 26 agosto 2026 la notte è andata così: il parser
          # ha trovato due cose che bloccavano, il job si è fermato — giustamente — la
          # issue è stata aperta, e poi QUESTO passo è morto su «cannot pull with rebase:
          # You have unstaged changes». Risultato: dati/da-fare.json è rimasto al 25 agosto
          # mentre stato-job.json diceva 26, cioè due file che la stessa notte scrive,
          # divergenti di un giorno.
          # È la stessa famiglia della sigla che dichiarava «incerti» mentre la riga era
          # cablata a tre chiavi: un testo che afferma quello che il codice non fa. Adesso
          # test/struttura.mjs confronta i due comandi e cade se divergono.
          git config user.name "aggiornamento-notturno"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/da-fare.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornare il riepilogo delle cose da fare (lavoro notturno)"
            git pull --rebase --autostash origin main && git push origin main || { git rebase --abort || true; echo "rebase non pulito: il file resta locale"; }
          fi
          TITOLO="Cose da fare — riepilogo del lavoro notturno"
          NUM=$(gh issue list --state open --search "\"$TITOLO\" in:title" --json number,title                   --jq ".[] | select(.title==\"$TITOLO\") | .number" | head -1)
          if [ "$(cat conto.txt)" = "0" ]; then
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "Non resta niente da fare: chiudo."
              gh issue close "$NUM"
            else
              echo "niente da fare e nessuna issue aperta: silenzio"
            fi
            exit 0
          fi
          if [ -n "$NUM" ]; then
            # modifica del corpo: NON notifica, ed è quello che si vuole
            gh issue edit "$NUM" --body-file corpo-dafare.md
            echo "issue #$NUM aggiornata in silenzio"
          else
            # creazione + assegnazione: notifica, ed è l'unica volta che deve farlo
            gh issue create --title "$TITOLO" --body-file corpo-dafare.md --assignee angrisanidj
          fi
