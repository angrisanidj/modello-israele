# Aggiornamento notturno dell'archivio da Wikipedia.
#
# Il job scarica la pagina dei sondaggi, esegue il parser vero (estratto da index.html),
# unisce le rilevazioni nuove a dati/archivio.json e deposita le voci-evento nel registro.
# Tocca SOLO file in dati/: index.html resta territorio delle sessioni di lavoro, e ogni
# commit del job su quel file sarebbe per definizione un'anomalia.
#
# Il modo di fallire è non fare niente: le guardie dentro aggiorna.mjs terminano il
# processo prima di ogni scrittura, npm run verifica fa da cancello dopo, e il push non
# forza mai — se il rebase non è pulito il job si arrende e riprova la notte dopo.
# Quando la guardia chiede una decisione umana (colonne di lista non riconosciute,
# configurazioni senza contenitore) viene aperta una issue con l'elenco di cosa mappare:
# è il segnale atteso per l'8 settembre, al deposito delle liste.
#
# Dopo il push c'è la spazzolata: il banco rilanciato con l'orologio al 23 ottobre, per
# sapere quali prove scadranno prima che scadano. Non ferma niente — apre una issue e basta
# — perché una prova che cadrà fra due mesi non è una ragione per non pubblicare i sondaggi
# di stanotte.
name: Aggiorna archivio
on:
  schedule:
    - cron: '30 3 * * *'    # 03:30 UTC, 05:30/06:30 in Israele: i sondaggi della sera sono in tabella
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: aggiorna-archivio
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node test/estrai.mjs
      # DA QUANTE NOTTI È FERMO non è ricavabile dai file: una notte bloccata non committa
      # niente, quindi non lascia traccia nel repository. Lo sa solo la storia delle
      # esecuzioni, ed è per questo che il riepilogo la legge invece di dedurlo.
      - name: Da quante notti è fermo
        id: notti
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh run list --workflow 'Aggiorna archivio' --limit 20 --json conclusion,status \n               --jq '[.[] | select(.status=="completed") | .conclusion] | index("success") // 0')
          echo "ferme=$N" >> "$GITHUB_OUTPUT"
          echo "notti fallite di fila prima di stanotte: $N"
      - name: Parser e guardie
        env:
          NOTTI_FERME: ${{ steps.notti.outputs.ferme }}
        run: node .github/scripts/aggiorna.mjs
      - name: Verifica completa con i dati nuovi
        run: npm run verifica
      - name: Commit e push dei soli file dati
        run: |
          if git diff --quiet dati/; then
            echo "niente di nuovo: nessun commit, nessuna pubblicazione"
            exit 0
          fi
          git config user.name "aggiornamento-notturno"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/archivio.json dati/eventi-grezzi.json dati/stato-job.json
          git commit -m "Aggiornare l'archivio dai sondaggi di Wikipedia (lavoro notturno)"
          # mai forzare: se nel frattempo è arrivato un push umano e il rebase non è
          # pulito, il job si arrende senza danni e riprova la notte successiva
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "rebase non pulito: mi arrendo senza forzare"
            exit 1
          fi
          git push origin main
      # LA SPAZZOLATA NON FERMA L'ARCHIVIO, ed è il motivo per cui sta DOPO il push.
      # npm run spazzola rilancia tutto il banco con l'orologio al 23 ottobre — il silenzio
      # demoscopico, il primo giorno in cui la finestra dei sette giorni si svuota da sola —
      # e dice quali prove danno per scontato un archivio fresco. Costa quattro minuti, che
      # in un job che gira una volta al giorno non si notano, ed è l'unico posto che se ne
      # accorgerebbe PRIMA del giorno in cui scatta.
      # Ma una prova che scadrà fra due mesi non è una ragione per smettere di pubblicare i
      # sondaggi di stanotte: il passo cattura l'esito invece di propagarlo, e quando cade
      # apre una issue come per le colonne di lista non riconosciute.
      - name: Spazzolata nel futuro
        id: spazzola
        run: |
          if npm run spazzola > spazzola.txt 2>&1; then
            echo "nessuna prova scade con l'orologio avanti"
          else
            echo "caduta=1" >> "$GITHUB_OUTPUT"
          fi
          cat spazzola.txt
      # ══ LA CONSEGNA, UNA VOLTA SOLA E IN FONDO ══
      #
      # Prima c'erano due issue — una per la guardia, una per la spazzolata — e le
      # segnalazioni restanti non erano da nessuna parte. Adesso il canale è uno:
      # dati/da-fare.json, e questa issue è la sua vista per una persona.
      #
      # LA REGOLA DEL SILENZIO. GitHub notifica alla CREAZIONE, al commento,
      # all'assegnazione e alla chiusura; NON alla modifica del corpo. Quindi: una email
      # quando la prima cosa da fare compare, silenzio finché resta pendente — il corpo si
      # riscrive e basta — e una email quando non resta niente e la issue si chiude. Se
      # arrivasse un'email ogni mattina, in una settimana nessuno la leggerebbe più.
      #
      # Sta in fondo e con if: always() perché deve uscire ANCHE quando npm run verifica è
      # rosso: quella è precisamente la notte in cui c'è qualcosa da fare.
      - name: Consegna il riepilogo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # il JavaScript sta in un file: multiriga dentro «run: |» rende il YAML invalido,
          # ed è già successo — la esecuzione fallisce in zero secondi e il job non parte
          SPAZZOLA_CADUTA=${{ steps.spazzola.outputs.caduta }} node .github/scripts/riepilogo.mjs
          [ -f corpo-dafare.md ] || exit 0
          if ! git diff --quiet dati/da-fare.json; then
            git config user.name "aggiornamento-notturno"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dati/da-fare.json
            git commit -m "Aggiornare il riepilogo delle cose da fare (lavoro notturno)"
            git pull --rebase origin main && git push origin main || { git rebase --abort || true; echo "rebase non pulito: il file resta locale"; }
          fi
          TITOLO="Cose da fare — riepilogo del lavoro notturno"
          NUM=$(gh issue list --state open --search "\"$TITOLO\" in:title" --json number,title                   --jq ".[] | select(.title==\"$TITOLO\") | .number" | head -1)
          if [ "$(cat conto.txt)" = "0" ]; then
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "Non resta niente da fare: chiudo."
              gh issue close "$NUM"
            else
              echo "niente da fare e nessuna issue aperta: silenzio"
            fi
            exit 0
          fi
          if [ -n "$NUM" ]; then
            # modifica del corpo: NON notifica, ed è quello che si vuole
            gh issue edit "$NUM" --body-file corpo-dafare.md
            echo "issue #$NUM aggiornata in silenzio"
          else
            # creazione + assegnazione: notifica, ed è l'unica volta che deve farlo
            gh issue create --title "$TITOLO" --body-file corpo-dafare.md --assignee angrisanidj
          fi
